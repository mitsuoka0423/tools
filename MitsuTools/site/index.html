<h1>MitsuTools</h1>
<p>クリップボード履歴とウィンドウ配置のメニューバーアプリ（macOS 26 以降）。</p>
<p><a class="button" href="downloads/MitsuTools.zip">最新版をダウンロード</a></p>
<h2>インストール</h2>
<ol>
  <li>zip を開き、MitsuTools.app を「アプリケーション」フォルダへ移す。</li>
  <li>MitsuTools を開く。メニューバーにアイコンが出る。</li>
  <li>「システム設定 › プライバシーとセキュリティ › アクセシビリティ」で MitsuTools をオンにする。</li>
</ol>
<p>以後のアップデートは、アプリが自動で確認します。</p>
